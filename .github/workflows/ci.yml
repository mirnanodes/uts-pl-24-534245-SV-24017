name: CI/CD

# - Every branch push and every PR to main/dev runs: test-backend + build-frontend.
# - Only a push to main also runs: deploy (build & push images to GHCR + smoke deploy).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests (php artisan test)
        run: php artisan test

  # ---------------------------------------------------------------------------
  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build (npm run build)
        run: npm run build
        env:
          VITE_API_URL: /api

  # ---------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: [test-backend, build-frontend]
    # PRs, dev and feature branches stop after test + build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image names (lowercase) and tag (commit SHA)
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "BACKEND_IMAGE=${prefix}-backend"
            echo "FRONTEND_IMAGE=${prefix}-frontend"
            echo "IMAGE_TAG=${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=SummitGear API (Laravel + FrankenPHP)
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=SummitGear frontend (Vue + Nginx)
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Create .env from GitHub Secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for name in APP_KEY DB_PASSWORD ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret ${name} belum diisi (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          cat > .env <<EOF
          APP_KEY=${APP_KEY}
          APP_URL=http://localhost:8080
          DB_DATABASE=summitgear
          DB_USERNAME=summitgear
          DB_PASSWORD=${DB_PASSWORD}
          ADMIN_EMAIL=admin@summitgear.test
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          EOF

      - name: Deploy the pushed images (docker compose up)
        run: docker compose up -d --no-build --wait --wait-timeout 240

      - name: Smoke test (health + login through the Nginx proxy)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          curl -fsS http://localhost:8080/api/health | tee health.json
          echo
          grep -q '"server":"frankenphp"' health.json
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/api/login \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"email\":\"admin@summitgear.test\",\"password\":\"${ADMIN_PASSWORD}\"}")
          echo "Login status: ${status}"
          test "${status}" = "200"

      - name: Show container status and backend logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=40 backend

      - name: Tear down
        if: always()
        run: docker compose down -v
